[package]
name = "cutver"
version = "0.6.0"
edition = "2024"
authors = ["Row0902"]
description = "Cut a release. Bump SemVer. Every project, every language."
license = "MIT"
repository = "https://github.com/cutver/cutver"
keywords = ["release", "semver", "version", "changelog", "tag"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["odd/"]

[dependencies]
clap = { version = "4", features = ["derive"] }
semver = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
toml_edit = "0.23"
serde_json = "1"
regex = "1"
minijinja = { version = "2", features = ["builtins"] }

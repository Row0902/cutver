# cutver's own release configuration — dogfooding.
# Every future bump of this crate runs through this tool.

[[manifest]]
path = "Cargo.toml"
kind = "cargo-package"

[preflight]
tests = "cargo test"
default_timeout = 600

[changelog]
path = "CHANGELOG.md"
format = "keep-a-changelog"
mode = "conventional"
entry_template = "See commit history since the previous tag."
template_file = ".github/templates/cutver/RELEASE.md"

[git]
tag_prefix = "v"
commit_message = "chore(release): v{version} [skip ci]"
require_clean_tree = true
require_branch = "main"

[hooks]
post_bump = "cargo check --workspace"

[publish]
push = true
commands = ["cargo publish"]
default_timeout = 300
